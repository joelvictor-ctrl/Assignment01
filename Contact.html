<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Joel Victor</title>

    <!-- Connects this page to the SAME CSS as the other pages -->
    <link rel="stylesheet" type="text/css" href="style.css">

</head>


<body>

    <div id="wrapper">


        <!-- HEADER - SAME AS OTHER PAGES -->

        <header>

            <h1>Joel Victor</h1>

            <nav>
                <a href="Homepage.html">Home</a>
                <a href="AboutMe.html">About Me</a>
                <a href="Projects.html">Projects</a>
                <a href="Contact.html">Contact Me</a>
            </nav>

        </header>


        <!-- MAIN CONTACT PAGE -->

        <main>

            <article>

                <section id="contact">

                    <h2>Contact Me</h2>

                    <p class="contact-intro">
                        Send me your questions, comments and project related queries!
                    </p>


                    <!-- CONTACT FORM -->

                    <form action="mailto:youremail@example.com"
                          method="post"
                          enctype="text/plain">


                        <!-- NAME -->

                        <label for="name">
                            Your Name
                        </label>

                        <input type="text"
                               id="name"
                               name="name"
                               placeholder="Enter your name"
                               required>


                        <!-- EMAIL -->

                        <label for="email">
                            Your Email
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Enter your email"
                               required>


                        <!-- MESSAGE -->

                        <label for="message">
                            Message
                        </label>

                        <textarea id="message"
                                  name="message"
                                  rows="8"
                                  placeholder="Question, comment or query..."
                                  required></textarea>


                        <!-- ANTI-ROBOT QUESTION -->

                        <label for="security">
                            Security Check: What is 5 + 3?
                        </label>

                        <input type="number"
                               id="security"
                               name="security"
                               required>


                        <!-- SUBMIT BUTTON -->

                        <input type="submit"
                               value="Submit">

                    </form>

                </section>

            </article>

        </main>

        

        <!-- FOOTER -->

        <footer>

            <address>
                Contact:
                <a href="mailto:joel.victor@ontariotechu.net">
                    joel.victor@ontariotechu.net
                </a>
            </address>

            <p>
                &copy; 2026 Joel Victor. All Rights Reserved.
            </p>

        </footer>


    </div>

</body>

</html>
